<!doctype html>
<!-- Vice Football mock-up (vice-football-plan.md step 2): Football section on the Vice panel, using the panel's own CSS.
     #a = London live + England idle; #b = London full time + England before kickoff; #s = spoilers off.
     Add ?phone for the phone layout. Render: brave-browser --headless=new --window-size=1280,800 --screenshot=... -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(inter-latin.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;height:100%;background:#0d0a14;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;margin:0;padding:0}
.bg{position:absolute;inset:0;background:#0d0a14 url(poster.jpg) 62% center/cover}
.phone .bg{background-image:url(poster-phone.jpg)}
.scrim{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(10,6,20,.62) 0%,rgba(10,6,20,.30) 48%,rgba(10,6,20,.10) 75%),
  linear-gradient(180deg,rgba(10,6,20,.15) 0%,rgba(10,6,20,0) 22%,rgba(10,6,20,.25) 48%,rgba(10,6,20,.72) 100%)}
.wrap{position:relative;padding:40px 56px}
.date{font-size:14px;letter-spacing:2.6px;font-weight:500;opacity:.72}
.greet{font-size:64px;font-weight:600;letter-spacing:-3.4px;margin-top:6px;white-space:nowrap}
.info{display:inline-flex;align-items:center;gap:10px;font-size:17px;color:rgba(255,255,255,.78);margin-top:10px;flex-wrap:wrap;padding:6px 14px;margin-left:-14px;border-radius:12px;background:rgba(14,10,24,.42)}
.info b{color:#fff;font-weight:500}.info .sep{opacity:.5}
.info span{display:flex;align-items:center;gap:8px}
.info img{width:20px;height:20px}
.label{font-size:17px;font-weight:500;opacity:.92;margin-bottom:14px;display:flex;align-items:center}
.label i{font-style:normal;opacity:.55;font-weight:400;margin-left:10px;font-size:15px}
.label .chip{margin-left:auto}
.ctx{margin-top:44px;opacity:.35}
.ctx .row .card{height:96px}
.row{display:flex;gap:18px}
.card{border-radius:14px;background:rgba(32,32,38,.82);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.chip{font-size:14px;font-weight:500;padding:9px 15px;border-radius:18px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.88);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip svg{width:16px;height:16px}
.chip.on{background:#f2f2f2;color:#141414}
.dot{width:8px;height:8px;border-radius:4px;background:#7ee2a8;box-shadow:0 0 0 3px rgba(126,226,168,.18);flex:none;display:inline-block}
.dot.live{background:#ff5c8a;box-shadow:0 0 0 3px rgba(255,92,138,.22);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* --- new: football cards --- */
.foot{margin-top:26px}
.fc{flex:1;min-width:0;padding:16px 20px 18px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.fc.live{box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 0 0 1.5px rgba(255,92,138,.55)}
.ftop{display:flex;align-items:center;gap:10px;height:34px}
.ftop img{width:30px;height:30px;object-fit:contain}
.ftop h4{font-size:20px;font-weight:500;flex:1}
.ftop .comp{font-size:13px;color:rgba(255,255,255,.5)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.side{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:1px;min-width:0}
.side.away{justify-content:flex-end;text-align:right}
.side img{width:40px;height:40px;object-fit:contain;flex:none}
.side span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{font-size:40px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:14px}
.nums i{font-style:normal;opacity:.4;font-weight:400}
.nums.ko{font-size:28px;letter-spacing:0}
.fc p{font-size:14px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc p em{font-style:normal;color:#fff;opacity:.9}
.res{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-size:12px;font-weight:600;margin-right:8px;vertical-align:1px}
.res.w{background:#7ee2a8;color:#0d2a1b}.res.d{background:#9a96a3;color:#141414}.res.l{background:#ff8a7a;color:#2a0d0d}
.next{display:flex;align-items:center;gap:14px}
.next img{width:44px;height:44px;object-fit:contain}
.next b{display:block;font-size:22px;font-weight:500}
.next small{font-size:14px;color:rgba(255,255,255,.62)}
.hidden{font-size:16px;color:rgba(255,255,255,.62);height:44px;display:flex;align-items:center;gap:10px}
.hidden svg{width:20px;height:20px;opacity:.7}

/* phone */
.phone .wrap{padding:28px 20px}
.phone .greet{font-size:40px;letter-spacing:-2px}
.phone .info{font-size:14px;gap:7px}
.phone .row{flex-direction:column;gap:12px}
.phone .ctx{display:none}
.phone .foot{margin-top:34px}
.phone .nums{font-size:34px}
.phone .side{font-size:14px}
.phone .side img{width:34px;height:34px}
.st{display:none}
</style></head>
<body>
<div class="bg"></div><div class="scrim"></div>
<div class="wrap">
  <div class="date">SATURDAY 5 DECEMBER</div>
  <div class="greet">Good afternoon</div>
  <div class="info" id="info"></div>
  <div class="ctx"><div class="label">Bedroom</div><div class="row"><div class="card" style="flex:1"></div><div class="card" style="flex:1"></div><div class="card" style="flex:1"></div><div class="card" style="flex:1"></div><div class="card" style="flex:1"></div></div></div>
  <div class="foot">
    <div class="label">Football <span class="chip" id="spoil"></span></div>
    <div class="row" id="cards"></div>
  </div>
</div>
<script>
if (location.search.includes("phone")) document.body.classList.add("phone");
const C = id => `crests/${id}.png`;
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>';
const head = (id, name, right) => `<div class="ftop"><img src="${C(id)}"><h4>${name}</h4>${right}</div>`;
const score = (h, hn, hs, a, an, as, ko) => `<div class="score"><div class="side"><img src="${C(h)}"><span>${hn}</span></div>
  <div class="nums${ko ? " ko" : ""}">${ko || `${hs}<i>–</i>${as}`}</div><div class="side away"><span>${an}</span><img src="${C(a)}"></div></div>`;
const card = (cls, html) => `<div class="card fc ${cls}">${html}</div>`;

const S = {
  sunLive: card("live", head(366, "London", `<span class="chip"><span class="dot live"></span>67'</span>`) +
    score(366, "SUN", 2, 361, "NEW", 1) +
    `<p>Premier League · <em>Isidor 64'</em> · Brobbey 12' · Isak 31'</p>`),
  sunFT: card("", head(366, "London", `<span class="chip">FT</span>`) +
    score(366, "SUN", 3, 361, "NEW", 2) +
    `<p><span class="res w">W</span>Premier League · <em>Isidor 64', 88'</em> · Brobbey 12'</p>`),
  engIdle: card("", head(448, "England", `<span class="comp">Friendly</span>`) +
    `<div class="next"><img src="${C(457)}"><div><b>v Ukraine</b><small>Sat 5 Dec · 17:30 · Wembley</small></div></div>` +
    `<p><span class="res w">W</span>Last: <em>2–0 v Croatia</em> · Nations League</p>`),
  engPre: card("", head(448, "England", `<span class="chip"><span class="dot"></span>in 25 min</span>`) +
    score(448, "ENG", 0, 457, "UKR", 0, "17:30") +
    `<p>Friendly · Wembley · <em>Kane starts</em></p>`),
  sunHidden: card("", head(366, "London", `<span class="chip">FT</span>`) +
    `<div class="hidden">${EYEOFF}Result hidden · tap to show</div><p>Premier League · v Newcastle (H)</p>`),
};
const state = location.hash.slice(1) || "a";
const set = {
  a: [S.sunLive, S.engIdle, `<span><img src="${C(366)}"><b>2–1</b> v Newcastle · 67'</span>`],
  b: [S.sunFT, S.engPre, `<span><img src="${C(448)}">England v Ukraine · <b>17:30</b></span>`],
  s: [S.sunHidden, S.engIdle, `<span><img src="${C(366)}">London · result hidden</span>`],
}[state];
document.getElementById("cards").innerHTML = set[0] + set[1];
document.getElementById("info").innerHTML = `<span>9° Cloudy</span><span class="sep">·</span>${set[2]}`;
document.getElementById("spoil").innerHTML = state === "s" ? `${EYEOFF}Spoilers off` : `${EYE}Spoilers`;
if (state === "s") document.getElementById("spoil").classList.add("on");
</script>
</body></html>
